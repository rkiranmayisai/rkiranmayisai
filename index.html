      z-index: 10;

      flex-direction: column;

  <p><a href="mailto:kiranmayi@example.com"><img src="https://img.shields.io/badge/Email_Me-FF1744?style=for-the-badge&logo=gmail&logoColor=white" /></a></p>
</div>\n`;
      }

      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;
      textarea.value = text.substring(0, start) + snippet + text.substring(end);
      textarea.selectionStart = textarea.selectionEnd = start + snippet.length;
      textarea.focus();
      renderPreview();
      showToast('⚡ Added ' + type.toUpperCase() + ' snippet!');
    }

    function loadTemplate(templateType) {
      const textarea = document.getElementById('markdown-input');
      if (templateType === 'fullstack') {
        textarea.value = `<div align="center">
  <h1>Reddy Kiranmayi | Full Stack Software Engineer</h1>
  <p>Building high-performance React frontends and scalable Node.js microservices.</p>
</div>
<br />
<h2>💻 Core Technical Arsenal</h2>
<p>React • Node.js • Express • PostgreSQL • Java • Redis</p>`;
      } else if (templateType === 'datascience') {
        textarea.value = `<div align="center">
  <h1>Reddy Kiranmayi | Data Science & Analytics Developer</h1>
  <p>Transforming complex datasets into actionable spatial visual heatmaps & ML models.</p>
</div>
<br />
<h2>🐍 Data Science Stack</h2>
<p>Python • Pandas • NumPy • Seaborn • Matplotlib • Scikit-Learn</p>`;
      } else {
        location.reload();
      }
      renderPreview();
      showToast('📄 Loaded ' + templateType.toUpperCase() + ' template!');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // Render immediately when DOM is ready
    window.addEventListener('DOMContentLoaded', () => {
      renderPreview();
    });
  </script>
</body>
</html>
